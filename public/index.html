<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#7c5cfc" />
    <meta name="description" content="AL-BURAQ - تطبيق النقل الذكي في الجزائر. فاوض على سعرك مع أفضل السائقين." />
    <meta name="keywords" content="taxi, algerie, البراق, تاكسي, الجزائر, نقل" />
    <meta name="author" content="AL-BURAQ Team" />

    <!-- Open Graph -->
    <meta property="og:title" content="AL-BURAQ - تاكسي الجزائر" />
    <meta property="og:description" content="تطبيق النقل الذكي في الجزائر - فاوض على سعرك" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo512.png" />

    <!-- Apple PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="البراق" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet" />

    <title>البراق | AL-BURAQ - تاكسي الجزائر 🇩🇿</title>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Cairo', sans-serif; background: #0d0b1f; }
      /* Splash screen */
      #splash {
        position: fixed; inset: 0; background: linear-gradient(160deg, #1e1b4b 0%, #4c3bd6 55%, #8b5cf6 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.5s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
            #splash h1 { color: #ffffff; font-size: 28px; font-weight: 900; letter-spacing: 4px; }
      #splash p { color: #ffffffb3; font-size: 13px; margin-top: 8px; }
      #splash .loader {
        width: 48px; height: 4px; background: #ffffff33; border-radius: 4px; margin-top: 32px; overflow: hidden;
      }
      #splash .loader-bar {
        height: 100%; background: linear-gradient(90deg, #ffffff, #c4b5fd, #ffffff);
        background-size: 200% 100%;
        animation: loading 1.5s ease infinite, shimmer 1.5s linear infinite;
        border-radius: 4px;
      }
      #splash .stage { position: relative; width: 240px; height: 230px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 18px; overflow: visible; }
      #splash .horse { position: absolute; bottom: 22px; left: 50%; width: 190px; margin-left: -95px; animation: fly-in 1.5s cubic-bezier(.12,.75,.2,1) both, hover 1.1s ease-in-out 1.5s infinite alternate; filter: drop-shadow(0 10px 18px rgba(20,10,70,.45)); }
      #splash .shadow { position: absolute; bottom: 4px; left: 50%; width: 130px; height: 14px; margin-left: -65px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(15,8,60,.55), transparent 70%); animation: shadow-in 1.5s cubic-bezier(.12,.75,.2,1) both, shadow-pulse 1.1s ease-in-out 1.5s infinite alternate; }
      #splash .streak { position: absolute; left: -10px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #ffffffcc); opacity: 0; animation: streak 1.1s ease-out both; }
      #splash .s1 { top: 70px; width: 120px; animation-delay: .05s; }
      #splash .s2 { top: 105px; width: 160px; animation-delay: .12s; }
      #splash .s3 { top: 140px; width: 100px; animation-delay: .2s; }
      #splash h1, #splash p { animation: rise .6s ease 1.2s both; }
      @keyframes fly-in { 0% { transform: translate(-150vw, -90px) rotate(-8deg) scale(.8); opacity: 0; } 12% { opacity: 1; } 70% { transform: translate(14px, 6px) rotate(2deg) scale(1.02); } 100% { transform: translate(0,0) rotate(0) scale(1); opacity: 1; } }
      @keyframes hover { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-9px) rotate(-1.5deg); } }
      @keyframes shadow-in { 0% { transform: scale(.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes shadow-pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(.82); opacity: .7; } }
      @keyframes streak { 0% { opacity: 0; transform: translateX(-40px); } 25% { opacity: .9; } 100% { opacity: 0; transform: translateX(120px); } }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash .horse, #splash .shadow, #splash .streak, #splash h1, #splash p { animation: none !important; opacity: 1; } #splash .streak { display: none; } }
      @keyframes pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.05)} }
      @keyframes loading { 0%{width:0%} 100%{width:100%} }
      @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    </style>
  </head>
  <body>
    <noscript>يحتاج هذا التطبيق JavaScript للعمل.</noscript>

    <!-- Splash Screen -->
    <div id="splash">
      <div class="stage">
        <span class="streak s1"></span><span class="streak s2"></span><span class="streak s3"></span>
        <div class="shadow"></div>
        <img class="horse" src="/horse.png" alt="AL-BURAQ" onerror="this.style.display='none'" />
      </div>
      <h1>AL-BURAQ</h1>
      <p>البُراق · تاكسي الجزائر 🇩🇿</p>
      <div class="loader"><div class="loader-bar"></div></div>
    </div>

    <div id="root"></div>

    <script>
      // Hide splash when app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hide');
            setTimeout(() => splash.remove(), 500);
          }
        }, 2600);
      });
    </script>
  </body>
</html>
