name: Get SHA1

on: [workflow_dispatch]

jobs:
  get-sha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run SHA1 Report
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport
