name: Get SHA1

on: [workflow_dispatch]

jobs:
  get-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Gradlew and Run Report
        run: |
          echo "=== مسار المشروع الحالي ==="
          ls -la
          
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -n "$GRADLEW_PATH" ]; then
            echo "تم العثور على gradlew في: $GRADLEW_PATH"
            DIR=$(dirname "$GRADLEW_PATH")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew signingReport
          else
            echo "لم يتم العثور على gradlew، سنقوم باستخراج بصمة KeyStore افتراضية..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
            keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android
          fi
