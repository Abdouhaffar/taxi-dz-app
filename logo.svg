<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a2340;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d485" />
      <stop offset="30%" style="stop-color:#d4a017" />
      <stop offset="60%" style="stop-color:#f0c040" />
      <stop offset="100%" style="stop-color:#b8860b" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe066" />
      <stop offset="50%" style="stop-color:#d4a017" />
      <stop offset="100%" style="stop-color:#9a6f00" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Decorative outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>

  <!-- Map grid lines (subtle background) -->
  <g opacity="0.08" stroke="#d4a017" stroke-width="0.8">
    <line x1="80" y1="140" x2="432" y2="140"/>
    <line x1="80" y1="190" x2="432" y2="190"/>
    <line x1="80" y1="240" x2="432" y2="240"/>
    <line x1="80" y1="290" x2="432" y2="290"/>
    <line x1="80" y1="340" x2="432" y2="340"/>
    <line x1="140" y1="80" x2="140" y2="420"/>
    <line x1="190" y1="80" x2="190" y2="420"/>
    <line x1="240" y1="80" x2="240" y2="420"/>
    <line x1="290" y1="80" x2="290" y2="420"/>
    <line x1="340" y1="80" x2="340" y2="420"/>
    <!-- Diagonal roads -->
    <line x1="100" y1="150" x2="350" y2="380"/>
    <line x1="160" y1="100" x2="420" y2="340"/>
    <line x1="100" y1="350" x2="380" y2="120"/>
  </g>

  <!-- Winged horse (simplified elegant silhouette) -->
  <g transform="translate(256, 185) scale(0.85)" filter="url(#glow)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="52" ry="28" fill="url(#goldGrad)" transform="rotate(-15)"/>
    <!-- Neck -->
    <ellipse cx="-30" cy="-25" rx="18" ry="26" fill="url(#goldGrad)" transform="rotate(-20)"/>
    <!-- Head -->
    <ellipse cx="-52" cy="-48" rx="22" ry="14" fill="url(#goldGrad)" transform="rotate(-35)"/>
    <!-- Ear -->
    <polygon points="-65,-62 -72,-75 -58,-68" fill="url(#goldGrad)"/>
    <!-- Mane -->
    <path d="M-38,-35 Q-28,-55 -18,-38 Q-10,-58 2,-40 Q8,-60 16,-42" stroke="url(#goldGrad2)" stroke-width="3" fill="none" opacity="0.9"/>
    <!-- Tail -->
    <path d="M52,-8 Q75,10 68,35 Q78,20 72,45 Q82,28 76,52" stroke="url(#goldGrad2)" stroke-width="4" fill="none" opacity="0.9"/>
    <!-- Legs -->
    <line x1="-20" y1="22" x2="-28" y2="58" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="5" y1="24" x2="0" y2="62" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="28" y1="20" x2="36" y2="56" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <line x1="48" y1="12" x2="60" y2="46" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Hooves -->
    <ellipse cx="-28" cy="62" rx="8" ry="4" fill="url(#goldGrad2)"/>
    <ellipse cx="0" cy="66" rx="8" ry="4" fill="url(#goldGrad2)"/>
    <ellipse cx="36" cy="60" rx="7" ry="4" fill="url(#goldGrad2)"/>
    <ellipse cx="60" cy="50" rx="7" ry="4" fill="url(#goldGrad2)"/>

    <!-- Wings -->
    <!-- Left wing upper -->
    <path d="M-10,-15 Q-50,-80 -90,-55 Q-60,-40 -35,-20" fill="url(#goldGrad)" opacity="0.95"/>
    <!-- Left wing lower -->
    <path d="M-5,-5 Q-55,-50 -85,-20 Q-55,-15 -25,5" fill="url(#goldGrad2)" opacity="0.8"/>
    <!-- Right wing upper -->
    <path d="M20,-10 Q65,-75 100,-48 Q72,-35 42,-12" fill="url(#goldGrad)" opacity="0.95"/>
    <!-- Right wing lower -->
    <path d="M25,2 Q72,-44 98,-12 Q68,-10 38,8" fill="url(#goldGrad2)" opacity="0.8"/>
    <!-- Wing feather lines -->
    <g stroke="#0a0f1e" stroke-width="0.8" opacity="0.4">
      <line x1="-10" y1="-15" x2="-70" y2="-65"/>
      <line x1="-10" y1="-15" x2="-80" y2="-48"/>
      <line x1="-10" y1="-15" x2="-85" y2="-30"/>
      <line x1="20" y1="-10" x2="78" y2="-60"/>
      <line x1="20" y1="-10" x2="88" y2="-42"/>
      <line x1="20" y1="-10" x2="92" y2="-22"/>
    </g>

    <!-- Eye -->
    <circle cx="-60" cy="-52" r="4" fill="#0a0f1e"/>
    <circle cx="-61" cy="-53" r="1.5" fill="#ffe066"/>
  </g>

  <!-- Gold separator line -->
  <line x1="100" y1="318" x2="412" y2="318" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- Arabic text البراق -->
  <text x="256" y="308" text-anchor="middle" font-family="'Scheherazade New', 'Amiri', 'Traditional Arabic', serif"
    font-size="72" font-weight="bold" fill="url(#goldGrad)" filter="url(#shadow)">البُراق</text>

  <!-- English text AL-BURAQ -->
  <text x="256" y="362" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif"
    font-size="36" font-weight="bold" letter-spacing="6" fill="url(#goldGrad)">AL-BURAQ</text>

  <!-- Tagline -->
  <text x="256" y="392" text-anchor="middle" font-family="'Georgia', serif"
    font-size="14" letter-spacing="3" fill="#d4a017" opacity="0.8">PREMIUM TAXI · الجزائر</text>

  <!-- Taxi icon small -->
  <g transform="translate(140, 408)" fill="url(#goldGrad)" opacity="0.7">
    <rect x="0" y="4" width="32" height="16" rx="3"/>
    <rect x="4" y="0" width="24" height="8" rx="2"/>
    <circle cx="7" cy="20" r="4" fill="#0a0f1e" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="25" cy="20" r="4" fill="#0a0f1e" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <rect x="14" y="5" width="1.5" height="6" fill="#0a0f1e" opacity="0.5"/>
  </g>

  <!-- Location pin right -->
  <g transform="translate(344, 404)" fill="url(#goldGrad)" opacity="0.7">
    <path d="M10,0 C4.5,0 0,4.5 0,10 C0,17 10,28 10,28 C10,28 20,17 20,10 C20,4.5 15.5,0 10,0 Z"/>
    <circle cx="10" cy="10" r="4" fill="#0a0f1e"/>
  </g>

  <!-- Corner decorations -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4">
    <path d="M80,100 L80,80 L100,80"/>
    <path d="M412,100 L412,80 L392,80"/>
    <path d="M80,412 L80,432 L100,432"/>
    <path d="M412,412 L412,432 L392,432"/>
  </g>
</svg>
